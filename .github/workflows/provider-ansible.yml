name: Provider Ansible syntax
on:
  workflow_call:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ansible-core
      - run: ansible-playbook -i localhost, --syntax-check ansible/provider.yml
